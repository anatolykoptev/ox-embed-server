[package]
name = "embed-server"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
ort-sys = "2.0.0-rc.12"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ndarray = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
moka = { version = "0.12", features = ["sync"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }

# Phase H.18 — OTEL distributed tracing. Pipes tracing::span!/info_span!/
# #[instrument] into Jaeger via OTLP gRPC, correlated with memdb-go traces
# through the W3C traceparent header. Versions chosen for compatibility:
# tracing-opentelemetry 0.31 needs opentelemetry 0.30 + opentelemetry_sdk 0.30.
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
tracing-opentelemetry = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
