name: preflight

# Per-PR gate. Public repo → `ubuntu-24.04-arm`: free, unlimited, and arm64,
# which is the architecture this actually ships on (pillow is ARM). Keeping the
# gate on the production architecture is not a detail here — the release profile
# sets `target-cpu`-sensitive codegen and the ONNX runtime is arch-specific.
#
# Gate composition, and why each stage exists:
#   fmt / clippy / deny / test / build — the pre-existing correctness gate.
#   gitleaks / osv-scanner            — security gates, mirroring oxpulse-chat's
#                                       preflight (issue #2799 there: a secret
#                                       reached main and a release tag before
#                                       any gate spoke).
#   mutants                           — the TEST-QUALITY gate. clippy and nextest
#                                       both pass on a test that asserts nothing.
#                                       cargo-mutants breaks the code the PR
#                                       touched and demands that some test
#                                       notice. Scope + rationale live in
#                                       .cargo/mutants.toml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned once, consumed by the install steps below. NEVER float these to
  # `latest` — the next upstream tag silently changes what the gate means.
  NEXTEST_VERSION: 0.9.140
  CARGO_DENY_VERSION: 0.20.2
  CARGO_MUTANTS_VERSION: 25.1.0
  GITLEAKS_VERSION: 8.30.1
  OSV_SCANNER_VERSION: 2.4.0

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  # A doc is a doc only if no code reads it: a changed `.md`/`docs/` path that a non-doc
  # tracked file names (test, embed, build script) is reclassified as code, and the job log
  # says which file referenced it. Glob/dir reads the scan cannot see: --not-doc / --skip-job.
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          # --- reference-aware pass: a doc that code reads is code ----------------------------
          scratch=
          cleanup() { if [ -n "$scratch" ] && [ -d "$scratch" ]; then rm -rf -- "$scratch"; fi; return 0; }
          trap cleanup EXIT
          # packaging manifests name README/CHANGELOG to ship it, not to read it
          pkg_manifest() {
            case "${1##*/}" in
              Cargo.toml | Cargo.lock | package.json | package-lock.json | pnpm-lock.yaml | pyproject.toml | setup.py | setup.cfg | MANIFEST.in | composer.json | *.gemspec | Dockerfile* | .goreleaser.y*ml | release-please-config.json) return 0 ;;
            esac
            return 1
          }
          community_file() {
            case "$1" in
              README | README.* | CHANGELOG | CHANGELOG.* | CHANGES | CHANGES.* | CONTRIBUTING | CONTRIBUTING.* | CODE_OF_CONDUCT | CODE_OF_CONDUCT.* | SECURITY | SECURITY.* | LICENSE | LICENSE.* | LICENCE | LICENCE.* | COPYING | NOTICE | AUTHORS) return 0 ;;
            esac
            return 1
          }
          ref_tree() { # shallow copy of the tree CI would test (the PR merge ref) in $scratch; non-zero on any doubt
            local rev tw=
            case "$EVENT" in
              pull_request) rev="refs/pull/$PR/merge" ;;
              *) rev="$AFTER" ;;
            esac
            command -v timeout >/dev/null 2>&1 && tw="timeout 120"
            scratch=$(mktemp -d) || { why="no scratch dir"; return 1; }
            git -C "$scratch" init -q || { why="git init failed"; return 1; }
            # the token travels in the environment, never argv (/proc/<pid>/cmdline is world-readable)
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
              $tw git -C "$scratch" fetch -q --depth=1 --no-tags "$SERVER/$REPO.git" "$rev" || { why="tree fetch failed ($rev)"; return 1; }
          }
          # ignore lists name files to leave out, never to read
          ignore_file() {
            case "${1##*/}" in .gitignore | .dockerignore | .npmignore | .prettierignore | .eslintignore | .gitattributes | .gitleaksignore | .markdownlintignore) return 0 ;; esac
            return 1
          }
          # third-party trees carry their own README/LICENSE/CHANGELOG mentions; they never read ours
          vendored() {
            case "$1" in
              vendor/* | */vendor/* | node_modules/* | */node_modules/* | third_party/* | */third_party/*) return 0 ;;
            esac
            return 1
          }
          # Does file $1 carry $2 on a line that is code? A comment line ("// see CLAUDE.md") names
          # a doc without reading it; directives that read ARE live (//go:embed, #[doc = include_str!]).
          live_mention() {
            git -C "$scratch" cat-file blob "FETCH_HEAD:$1" 2>/dev/null | LC_ALL=C awk -v n="$2" '
              index($0, n) { l = $0; sub(/^[ \t]+/, "", l)
                if (l ~ /^(\/\/go:|#\[|#!|#include|#embed|#import)/ || l !~ /^(\/\/|#|\*|\/\*|--|<!--)/) { found = 1; exit } }
              END { exit !found }'
          }
          # Does a non-doc tracked file read any of the candidate docs? 0 = no, 1 = yes (why says
          # which), 2 = the scan itself failed. Any non-zero means full CI.
          ref_scan() {
            local pats="$scratch/pats" f b hits line src m t bn dir stem p rc=0 start=$SECONDS
            declare -A seen
            : > "$pats"
            for f in "$@"; do
              b=${f##*/}
              # LICENSE, NOTICE, COPYING are English words and nothing reads them: not scanned
              case "$b" in *.*) printf '%s\n%s\n' "$f" "$b" >> "$pats" ;; esac
            done
            [ -s "$pats" ] || return 0
            # (1) literal: the full path or the basename as a whole word. The basename is what
            # filepath.Join(root, "docs", "x.md") and read('DESIGN.md') leave in the source.
            hits=$(git -C "$scratch" grep -I -w -F -o -f "$pats" FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="reference scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; m=${line#*:}
              [ -z "${seen[$src|$m]:-}" ] || continue
              seen[$src|$m]=1
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
              is_doc "$src" && continue
              vendored "$src" && continue
              ignore_file "$src" && continue
              pkg_manifest "$src" && community_file "${m##*/}" && continue
              live_mention "$src" "$m" || continue
              why="$m treated as code: referenced by $src"
              return 1
            done <<<"$hits"
            # (2) glob: embed/glob patterns with a literal stem (skills/d10-*.md) or a literal
            # directory (skills/*.md). Bare `*.md` / `**/*.md` come from ignore files, linters and
            # --include flags and would make every doc code: ignored, covered by --not-doc.
            rc=0
            hits=$(git -C "$scratch" grep -I -o -E -e '[A-Za-z0-9_@+./*?-]*[*?][A-Za-z0-9_@+./*?-]*[.]mdx?' FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="glob scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; t=${line#*:}
              [ -z "${seen[$src|$t]:-}" ] || continue
              seen[$src|$t]=1
              is_doc "$src" && continue
              vendored "$src" && continue
              bn=${t##*/}; dir=
              case "$t" in */*) dir=${t%/*} ;; esac
              stem=${bn//[*?]/}; stem=${stem%.mdx}; stem=${stem%.md}
              if [ -z "$stem" ]; then
                case "$dir" in "" | *[*?]*) continue ;; esac
              fi
              for p in "$@"; do
                case "$p" in
                  $t | */$t)
                    live_mention "$src" "$t" || break
                    why="$t treated as code: glob in $src matches $p"
                    return 1 ;;
                esac
              done
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
            done <<<"$hits"
            return 0
          }
          docs_only=false
          cands=()
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do
              if is_doc "$f"; then cands+=("$f"); else docs_only=false; why="code path: $f"; break; fi
            done <<<"$list"
            if [ "$docs_only" = true ]; then
              rc=0
              if ! ref_tree; then
                docs_only=false; why=${why:-tree fetch failed}
              else
                ref_scan "${cands[@]}" || rc=$?
                [ "$rc" -eq 0 ] || { docs_only=false; why=${why:-reference scan failed}; }
              fi
              [ "$docs_only" != true ] || why="${#cands[@]} doc paths, none read by code"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" | tee -a "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # `mutants --in-diff` below diffs against the PR base, which needs
          # real history. The default shallow clone makes that merge-base
          # unreachable and the step would silently mutate nothing.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        run: |
          curl -sSfL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C ~/.cargo/bin

      - name: Install cargo-deny
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            | tar -xz -C ~/.cargo/bin --strip-components=1

      # cargo-mutants publishes NO aarch64-linux binary — every release ships
      # x86_64 linux/macOS and windows only. On this arm64 runner it has to be
      # built from source, so the binary is cached explicitly.
      #
      # This is actions/cache on a single ~200 KB binary keyed by version+arch,
      # NOT on target/. PR #142 removed actions/cache from this workflow because
      # caching the target dir corrupted it; that reasoning does not extend to an
      # immutable versioned executable, and Swatinem/rust-cache (which replaced
      # it, and is still used above) deliberately does not cache ~/.cargo/bin.
      - name: Cache cargo-mutants binary
        id: cache-mutants
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ env.CARGO_MUTANTS_VERSION }}-aarch64

      - name: Install cargo-mutants
        if: steps.cache-mutants.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --locked --version "${CARGO_MUTANTS_VERSION}"

      - name: Verify cargo-mutants version
        run: |
          # Assert the pin, whether the binary came from cache or a fresh build.
          # A stale cache entry under a reused key would otherwise silently
          # change what the gate means.
          got="$(cargo mutants --version)"
          echo "$got"
          case "$got" in
            *"${CARGO_MUTANTS_VERSION}"*) ;;
            *) echo "::error::cargo-mutants is '${got}', expected ${CARGO_MUTANTS_VERSION}"; exit 1 ;;
          esac

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" \
            | tar -xz -C ~/.cargo/bin gitleaks
          gitleaks version

      - name: Install osv-scanner
        run: |
          curl -sSfL -o ~/.cargo/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_arm64"
          chmod +x ~/.cargo/bin/osv-scanner
          osv-scanner --version

      # ── security gates ──────────────────────────────────────────────────

      - name: gitleaks (secrets scan)
        timeout-minutes: 5
        run: |
          # Scans the working tree, not history: the point is to stop a secret
          # from ENTERING main. `--no-banner` keeps the log readable; a finding
          # exits non-zero and fails the job.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact

      - name: osv-scanner (dependency vulnerabilities)
        timeout-minutes: 10
        run: |
          # Complements `cargo deny check advisories`: deny reads RustSec only,
          # OSV also carries GHSA and the distro feeds, so a crate advisory that
          # lands in GHSA first is caught here days earlier.
          osv-scanner scan source --lockfile=Cargo.lock --config=.osv-scanner.toml

      # ── correctness gates ───────────────────────────────────────────────

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

      - name: deny
        run: cargo deny check

      - name: test
        run: cargo nextest run --locked --all-targets --workspace

      - name: build
        run: cargo build --release --locked

      # ── test-quality gate ───────────────────────────────────────────────

      - name: mutants (test quality on changed lines)
        # PRs only: `--in-diff` needs a base to diff against, and a push to main
        # has already been through this gate on its PR.
        if: github.event_name == 'pull_request'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          # Diff against the merge-base, not the base tip: `...` gives the lines
          # THIS branch changed, excluding whatever landed on main meanwhile.
          # Without it, a PR is failed by unmutated lines it never touched.
          #
          # Pathspec is `src`, NOT 'src/**/*.rs'. A git pathspec is wildmatch
          # without FNM_PATHNAME, so `*` does not cross `/` and `src/**/*.rs`
          # requires at least one intermediate directory: it silently matched
          # src/ipc/frame.rs and src/supervisor/handle.rs while missing
          # src/metrics.rs, src/batcher.rs, src/api.rs and every other file
          # directly in src/. This step reported "nothing to mutate" and passed
          # green on a PR that changed 158 lines of src/metrics.rs. Caught on
          # this workflow's own first green run.
          BASE="origin/${{ github.base_ref }}"
          git diff "${BASE}...HEAD" -- src > /tmp/pr.diff
          if [ ! -s /tmp/pr.diff ]; then
            echo "No src/ changes in this PR — nothing to mutate."
            exit 0
          fi
          echo "::group::PR diff stat"
          git diff --stat "${BASE}...HEAD" -- src
          echo "::endgroup::"
          # Scope (examine_globs) + timeouts live in .cargo/mutants.toml so this
          # workflow and the nightly full run cannot disagree about what is in
          # scope. A MISSED mutant here means: you changed this line, and no
          # test in the suite notices when it is broken.
          # Not piped to tee: `$?` after a pipe is the pipe's, and this exit
          # code is the gate. `|| rc=$?` keeps `bash -e` from aborting before
          # the self-check below can read the log.
          rc=0
          cargo mutants --in-diff /tmp/pr.diff --no-shuffle -j 2 > /tmp/mutants.log 2>&1 || rc=$?
          cat /tmp/mutants.log

          # Self-check against the failure above recurring in a new form: if the
          # PR touched a file that .cargo/mutants.toml puts IN scope, then
          # cargo-mutants must have RUN. What proves it ran is the enumeration
          # line, which it prints whenever it reached the diff — including for
          # zero:
          #
          #     Found 0 mutants to test
          #
          # It is NOT `mutants.out/outcomes.json`. That file is only written
          # when there is at least one mutant, so requiring it failed PR #164,
          # where the in-scope files (`supervisor/handle.rs`, `supervisor/pool.rs`)
          # changed only by gaining a #[cfg(test)] seam and the production edits
          # landed in `api*.rs`, which is out of scope. Nothing to mutate is a
          # legitimate outcome; never having run is not, and only the second is
          # the false-green this check exists to catch.
          if git diff --name-only "${BASE}...HEAD" -- src \
               | grep -qE '^src/(api_health|batcher|cache|cache_flow|config|evictable_pool|metrics|pool|token_cache|types|worker_waiters)\.rs$|^src/(ipc|supervisor)/.*\.rs$'; then
            if ! grep -qE '^Found [0-9]+ mutants to test' /tmp/mutants.log; then
              echo "::error::This PR changes a file in the mutation scope, but cargo-mutants never reported a mutant count. The gate did not run — do not read this job's green as test-quality evidence."
              exit 1
            fi
            # Ran, but had nothing in scope to break. Say so out loud: a silent
            # pass here reads as "test quality verified", and it is not.
            if grep -qE '^Found 0 mutants to test' /tmp/mutants.log; then
              echo "::notice::cargo-mutants ran and found 0 mutants in the changed lines. The in-scope files changed only outside mutable production code (test seams, comments, signatures). This job is NOT test-quality evidence for this PR."
            fi
          fi

          exit "$rc"

      - name: Upload mutants report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mutants-in-diff
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  # Docs-only PRs skip `preflight` (docs-scope) and with it the secret scan, the
  # dependency scan and cargo deny: a secret pasted into a .md would reach main
  # unscanned (oxpulse-chat #2882). This twin runs the same three commands on
  # exactly those PRs. Code PRs keep them inside `preflight`, so nothing runs twice.
  # The id matches KEEP_RE in docs-gate.rb; it is not a required check unless the
  # ruleset lists it. Keep the commands in step with the preflight steps above.
  security-docs:
    name: security scans (docs-only PRs)
    needs: [docs-scope]
    if: ${{ !cancelled() && needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            | tar -xz -C ~/.cargo/bin --strip-components=1

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" \
            | tar -xz -C ~/.cargo/bin gitleaks
          gitleaks version

      - name: Install osv-scanner
        run: |
          curl -sSfL -o ~/.cargo/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_arm64"
          chmod +x ~/.cargo/bin/osv-scanner
          osv-scanner --version

      - name: gitleaks (secrets scan)
        timeout-minutes: 5
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

      - name: osv-scanner (dependency vulnerabilities)
        timeout-minutes: 10
        run: osv-scanner scan source --lockfile=Cargo.lock --config=.osv-scanner.toml

      - name: deny
        run: cargo deny check
