[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Deny known vulnerabilities; warn on yanked crates so the build stays green
# while giving visibility that a crate needs updating.
ignore = [
    # paste is a transitive dep via tokenizers → macro_rules_attribute.
    # No safe upgrade exists; tokenizers upstream tracks this.
    { id = "RUSTSEC-2024-0436", reason = "transitive via tokenizers; no upstream fix available" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["anatolykoptev"]
gitlab = []
bitbucket = []
