[package]
name = "embed-server"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
ort-sys = "2.0.0-rc.12"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ndarray = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
moka = { version = "0.12", features = ["sync"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
bincode = { version = "2", features = ["serde"] }

# Phase H.18 — OTEL distributed tracing. Pipes tracing::span!/info_span!/
# #[instrument] into Jaeger via OTLP gRPC, correlated with memdb-go traces
# through the W3C traceparent header. Versions chosen for compatibility:
# tracing-opentelemetry 0.31 needs opentelemetry 0.30 + opentelemetry_sdk 0.30.
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
tracing-opentelemetry = "0.31"

# Linux-only: glibc `malloc_trim(0)` background task in `main.rs` returns
# unused trailing arena pages to the OS on a 100 ms cadence (TEI pattern,
# `router/src/main.rs:222-229`). Compiled out on macOS/Windows via cfg
# guards in main.rs — the dependency itself only links on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

# 2026-05-02 — explicit test profile for fast iteration. Inherits debug
# default (opt=0 own crate, opt=1 deps via .package."*" above) but adds:
#  - incremental=true   → reusable artifact cache between test runs
#  - codegen-units=256  → max parallelism on multi-core hosts (4-core ARM box)
#  - debug=false        → smaller artifacts, faster link
# Iteration: ~30s test compile vs ~5-15min under --release. Use
# `cargo test` (no --release) for unit work; only release for actual perf bench.
[profile.test]
incremental = true
codegen-units = 256
debug = false

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
# tower + http-body-util: used by api.rs handler tests (axum oneshot call pattern).
# Tower is already a transitive dep of axum; pinning explicitly makes the test
# import `use tower::ServiceExt` reliable across lockfile updates.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# tempfile — used by `model_reranker::load::discovery_tests` to drive
# the static-shape filename parser through synthetic dirs without any
# real ONNX bytes (placeholder empty files only). Keep dev-only so it
# doesn't bloat the production container.
tempfile = "3"
# serial_test — enforce sequential execution for tests that call
# std::env::set_var. std::env::set_var is unsafe since Rust 1.82 (glibc
# setenv is non-reentrant); concurrent calls from parallel test threads = UB.
serial_test = "3"

[lib]
name = "embed_server"
path = "src/lib.rs"

[[bin]]
name = "embed-server"
path = "src/main.rs"

[[bin]]
name = "embed-worker"
path = "src/bin/worker.rs"
